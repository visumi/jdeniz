<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="description" content="Acompanhe seus alunos com clareza e consistência." />
    <title>JDeniz | Gestão de alunos</title>
    <style>
      .boot-loading-screen { position: fixed; inset: 0; z-index: 40; display: grid; min-height: 100dvh; place-items: center; overflow: hidden; box-sizing: border-box; background: #fafdff; color: #1e293b; padding: 2.5rem 1.25rem; text-align: center; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Helvetica Neue", Arial, sans-serif; }
      .boot-loading-content { display: grid; width: 100%; max-width: 24rem; justify-items: center; gap: 1.75rem; }
      .boot-loading-stage { position: relative; display: grid; width: 9rem; height: 9rem; place-items: center; }
      .boot-loading-halo { position: absolute; inset: 1.5rem; border-radius: 9999px; background: rgba(14, 165, 233, 0.22); filter: blur(18px); animation: boot-loading-halo 2.6s ease-in-out infinite; }
      .boot-loading-orbit { position: absolute; inset: 0.75rem; border: 1px solid rgba(14, 165, 233, 0.25); border-top-color: #0ea5e9; border-right-color: transparent; border-radius: 9999px; animation: boot-loading-orbit 1.8s linear infinite; }
      .boot-loading-orbit::after { position: absolute; top: -0.22rem; left: 50%; width: 0.45rem; height: 0.45rem; border-radius: 9999px; background: #0ea5e9; box-shadow: 0 0 0 4px rgba(14, 165, 233, 0.14); content: ""; transform: translateX(-50%); }
      .boot-loading-logo { position: relative; z-index: 1; width: 5rem; height: 5rem; }
      .boot-loading-copy { display: grid; gap: 0.5rem; }
      .boot-loading-title { margin: 0; font-size: 1.5rem; line-height: 1.25; font-weight: 700; letter-spacing: -0.025em; }
      .boot-loading-status { display: flex; align-items: center; gap: 0.5rem; width: fit-content; margin: 0 auto; border: 1px solid #bae6fd; border-radius: 9999px; background: #f0f9ff; padding: 0.375rem 0.75rem; color: #075985; font-size: 0.75rem; line-height: 1rem; font-weight: 500; box-shadow: 0 0 0 4px rgba(14, 165, 233, 0.05); animation: boot-loading-status-glow 2.6s ease-in-out infinite; }
      .boot-loading-dot { width: 0.375rem; height: 0.375rem; border-radius: 9999px; background: #0ea5e9; animation: boot-loading-dot 1.2s ease-in-out infinite; }
      @keyframes boot-loading-halo { 0%, 100% { opacity: 0.48; transform: scale(0.88); } 50% { opacity: 0.8; transform: scale(1.08); } }
      @keyframes boot-loading-orbit { to { transform: rotate(360deg); } }
      @keyframes boot-loading-dot { 0%, 100% { opacity: 0.35; transform: scale(0.8); } 50% { opacity: 1; transform: scale(1.3); } }
      @keyframes boot-loading-status-glow { 0%, 100% { box-shadow: 0 0 0 4px rgba(14, 165, 233, 0.04); } 50% { box-shadow: 0 0 0 6px rgba(14, 165, 233, 0.09); } }
      @media (prefers-reduced-motion: reduce) { .boot-loading-halo, .boot-loading-orbit, .boot-loading-status, .boot-loading-dot { animation: none; } }
    </style>
  </head>
  <body>
    <div id="boot-loading"><main class="boot-loading-screen" aria-label="Carregando JDeniz" role="status"><div class="boot-loading-content"><div class="boot-loading-stage" aria-hidden="true"><span class="boot-loading-halo"></span><span class="boot-loading-orbit"></span><svg class="boot-loading-logo" viewBox="0 0 48 48" fill="none"><rect x="1" y="1" width="46" height="46" rx="13" fill="#0ea5e9" /><path fill="white" d="M28.4 9.5h-7v16.7c0 3.5-1.7 5.1-4.4 5.1-2 0-3.6-1-4.6-2.9l-5.3 3.1c1.9 3.7 5.3 5.7 9.9 5.7 7.1 0 11.4-4 11.4-11.2V9.5Z" /><path d="M8.2 33.5c3.2 4.3 7.5 6.4 12.6 6.4 5.7 0 10.7-2.6 13.7-7.1" stroke="#bae6fd" stroke-width="2.6" stroke-linecap="round" /><path d="M31.5 10.2h5.1" stroke="#e0f2fe" stroke-width="2.6" stroke-linecap="round" /></svg></div><div class="boot-loading-copy"><h1 class="boot-loading-title">Preparando seu espaço</h1><div class="boot-loading-status"><span class="boot-loading-dot" aria-hidden="true"></span>Conectando seus dados</div></div></div></main></div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
