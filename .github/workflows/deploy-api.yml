name: Deploy API

on:
  push:
    branches: [main]
    paths:
      - "apps/api/**"
      - ".github/workflows/deploy-api.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Sync Worker secrets
        env:
          TURSO_URL: ${{ secrets.TURSO_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          OWNER_EMAIL: ${{ secrets.OWNER_EMAIL }}
        run: |
          set -euo pipefail
          trap 'rm -f .worker-secrets.json' EXIT
          node - <<'NODE'
          const fs = require("node:fs");
          const names = ["TURSO_URL", "TURSO_AUTH_TOKEN", "FIREBASE_PROJECT_ID", "OWNER_EMAIL"];
          const values = Object.fromEntries(names.map((name) => [name, process.env[name] || ""]));
          if (Object.values(values).some((value) => !value)) throw new Error("All Worker secrets must be configured in GitHub Actions.");
          fs.writeFileSync(".worker-secrets.json", JSON.stringify(values));
          NODE
          npx wrangler secret bulk .worker-secrets.json --config apps/api/wrangler.jsonc
      - name: Deploy Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --config apps/api/wrangler.jsonc --minify
